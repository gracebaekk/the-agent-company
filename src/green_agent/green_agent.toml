name = "agent_company_green_agent"
description = "The assessment hosting agent for the agent company."
version = "0.1.0"

defaultInputModes = ["text"]
defaultOutputModes = ["text"]

[capabilities]
message = true
task = false
streaming = false

[[skills]]
id = "host_assess_the_agent_company"
name = "TheAgentCompany assessment hosting"
description = """
Assess the tool-calling ability of a white agent using TheAgentCompany framework.

REQUIRED: The evaluation request MUST include task names in one of these formats:
1. <evaluation_config>{"task_names": ["task1", "task2"]}</evaluation_config>
2. Task names: task1, task2
3. Evaluate on the following tasks: task1, task2

Without task names, the agent will use default tasks.
"""
tags = ["green agent", "assessment hosting", "the-agent-company"]

examples = ["""
Your task is to begin an assessment of the white agent located at:

<white_agent_url>
http://localhost:9002/
</white_agent_url>

You should use the following evaluation configuration:

<evaluation_config>
{
  "task_names": [
    "pm-send-hello-message",
    "pm-create-channel-new-leader"
  ]
}
</evaluation_config>
"""]